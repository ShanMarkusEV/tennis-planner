<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Training Planner</title>
<meta name="description" content="Build a 2-hour tennis training session for mixed member levels.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
<style>
  :root {
    --bg: #f6f7f2; --surface: #ffffff; --surface-2: #eef0e7; --text: #1b1f17; --muted: #5d6555;
    --border: #d9ddcf; --accent: #3f7d20; --accent-ink: #ffffff; --accent-soft: #e2efd9;
    --court: #3a7d5c; --court-out: #2f6a4c; --court-line: #ffffff; --court-net: #e5e7eb;
    --warn-bg: #fff4d6; --warn-ink: #6b4e00; --break: #2b6cb0; --break-soft: #e3eefa;
    --radius: 14px; --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11140f; --surface: #1a1e17; --surface-2: #232820; --text: #e8ecdf; --muted: #9ca592;
      --border: #30362b; --accent: #8fd16a; --accent-ink: #11140f; --accent-soft: #263a1c;
      --court: #2c5e46; --court-out: #234c38; --court-line: #e5e7eb; --court-net: #cbd5e1;
    --warn-bg: #3a2f10; --warn-ink: #f3d68a; --break: #7fb2ec; --break-soft: #18263a;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11140f; --surface: #1a1e17; --surface-2: #232820; --text: #e8ecdf; --muted: #9ca592;
    --border: #30362b; --accent: #8fd16a; --accent-ink: #11140f; --accent-soft: #263a1c;
    --court: #2c5e46; --court-out: #234c38; --court-line: #e5e7eb; --court-net: #cbd5e1;
    --warn-bg: #3a2f10; --warn-ink: #f3d68a; --break: #7fb2ec; --break-soft: #18263a;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font: inherit; font-size: .9rem; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text);
    padding: 9px 14px; border-radius: 999px; font: inherit; font-size: .95rem; cursor: pointer; min-height: 44px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 0; border-radius: 9px; cursor: pointer; min-height: 44px; }
  .seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .unfit { font-size: .75rem; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .shuffle { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; font: inherit; font-size: .8rem; font-weight: 600; padding: 4px 10px; min-height: 32px; cursor: pointer; flex: none; }
  .choose { display: block; margin-top: 14px; min-width: 0; width: 100%; text-overflow: ellipsis; min-height: 38px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; font-size: .88rem; padding: 0 10px; }
  .item.swapped { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .toggles { display: grid; gap: 4px; margin-top: 16px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; cursor: pointer; min-height: 44px; }
  .toggle input { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; transition: background .15s; margin: 0; flex: none; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(18px); }
  .toggle small { display: block; color: var(--muted); font-size: .8rem; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; min-height: 46px;
    background: var(--accent); color: var(--accent-ink);
  }
  .btn.secondary { background: var(--surface-2); color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1 1 auto; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin-bottom: 14px; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .summary strong { font-size: 1.05rem; }
  .summary span { color: var(--muted); font-size: .85rem; }
  ol.timeline { list-style: none; padding: 0; margin: 0 0 14px; }
  .item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
  .item:first-child { border-top: 0; padding-top: 0; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); font-size: .9rem; padding-top: 2px; }
  .block { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
  .name { font-weight: 600; margin: 1px 0 4px; }
  .mins { color: var(--muted); font-weight: 500; font-size: .9rem; white-space: nowrap; }
  .cues { color: var(--muted); font-size: .9rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  details.drill[open] .cues { display: block; }
  .tip { margin: 0; font-size: .9rem; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
  .lvls { list-style: none; padding: 0 !important; display: grid; gap: 6px; }
  .lvls b { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
  details.extra { margin-top: 14px; }
  details.extra > summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--muted); }
  details.drill > summary { list-style: none; cursor: pointer; }
  details.drill > summary::-webkit-details-marker { display: none; }
  .more { display: inline-block; margin-top: 6px; font-size: .85rem; font-weight: 600; color: var(--accent); }
  .more::after { content: " ▾"; }
  details.drill[open] .more::after { content: " ▴"; }
  details.drill[open] .more { font-size: 0; } details.drill[open] .more::before { content: "Hide details"; font-size: .85rem; }
  .drill-body { margin-top: 10px; font-size: .92rem; }
  .drill-body h4 { margin: 14px 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .drill-body p, .drill-body ol, .drill-body ul { margin: 0; }
  .drill-body ol, .drill-body ul { padding-left: 20px; }
  .drill-body li + li { margin-top: 3px; }
  .sources { margin-top: 12px !important; font-size: .8rem; color: var(--muted); }
  .sources a, .drill-body a { color: var(--accent); }
  .photo { width: 100%; border-radius: 10px; margin-bottom: 8px; display: block; }
  svg.diagram { width: 100%; height: auto; display: block; border-radius: 10px; }
  .dg-surround { fill: var(--court-out); } .dg-court { fill: var(--court); }
  .dg-lines line, .dg-lines rect { stroke: var(--court-line); stroke-width: .35; }
  .dg-net { stroke: var(--court-net); stroke-width: .7; }
  .dg-target { fill: rgb(250 204 21 / .35); stroke: #facc15; stroke-width: .3; }
  .dg-cone { fill: #f97316; }
  .dg-feed { stroke: #f97316; stroke-width: .5; } .dg-feed-head { fill: #f97316; }
  .dg-shot { stroke: #fde047; stroke-width: .55; } .dg-shot-head { fill: #fde047; }
  .dg-move { stroke: #fff; stroke-width: .45; } .dg-move-head { fill: #fff; }
  .dg-player circle { fill: #1d4ed8; stroke: #fff; stroke-width: .35; }
  .dg-coach circle { fill: #dc2626; stroke: #fff; stroke-width: .35; }
  .dg-player text, .dg-coach text { fill: #fff; font: 700 2.2px system-ui, sans-serif; }
  .dg-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .75rem; color: var(--muted); margin: 6px 0 2px; }
  .dg-legend i { display: inline-block; width: 14px; height: 10px; margin-right: 4px; vertical-align: -1px; border-radius: 2px; }
  .lg-player { background: #1d4ed8; border-radius: 50% !important; width: 10px !important; }
  .lg-coach { background: #dc2626; border-radius: 50% !important; width: 10px !important; }
  .lg-feed { border-top: 2px dashed #f97316; height: 0 !important; }
  .lg-shot { border-top: 2px solid #eab308; height: 0 !important; }
  .lg-move { border-top: 2px dotted var(--muted); height: 0 !important; }
  .lg-cone { width: 0 !important; height: 0 !important; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 9px solid #f97316; border-radius: 0 !important; }
  .lg-target { background: rgb(250 204 21 / .45); border: 1px solid #eab308; }
  .lib-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .lib-filters .chip { min-height: 36px; padding: 6px 12px; font-size: .85rem; flex: none; }
  .lib-item { border-top: 1px solid var(--border); padding: 12px 0; }
  .lib-item:first-child { border-top: 0; }
  .lvl { font-size: .75rem; color: var(--muted); }
  .item.break .block { color: var(--break); }
  .item.break .name { color: var(--break); }
  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin: 0 0 14px; background: var(--surface-2); }
  .bar i { display: block; height: 100%; border-right: 2px solid var(--surface); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  details.hist { border-top: 1px solid var(--border); padding: 10px 0; }
  details.hist:first-of-type { border-top: 0; }
  details.hist summary { cursor: pointer; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
  details.hist summary::-webkit-details-marker { display: none; }
  details.hist summary span { color: var(--muted); font-size: .85rem; }
  details.hist ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: .9rem; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
  @media print {
    header .tabs, #settings, .btn-row, .banner, .shuffle, .choose { display: none !important; }
    .card { box-shadow: none; border: 0; padding: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎾 Training Planner</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="plan">Plan</button>
      <button role="tab" aria-selected="false" data-tab="drills">Drills</button>
      <button role="tab" aria-selected="false" data-tab="history">History</button>
    </nav>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section id="tab-plan">
    <div class="card" id="settings">
      <h2>Who's on court</h2>
      <div class="chips" id="levels"></div>
      <h2 style="margin-top:16px">Players on court</h2>
      <div class="seg" id="players" role="radiogroup" aria-label="Players on court"></div>
      <div class="toggles">
        <label class="toggle"><span>Include Serve<small>10 min serve block</small></span><input type="checkbox" id="serve"></label>
      </div>
      <h2 style="margin-top:12px">Games at the end</h2>
      <div class="seg" id="game" role="radiogroup" aria-label="Games at the end"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" id="generate">Generate 2-hour plan</button>
      </div>
    </div>

    <div class="card" id="result" hidden>
      <div class="summary"><strong id="sum-title"></strong><span id="sum-meta"></span></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
      <ol class="timeline" id="timeline"></ol>
      <div class="btn-row">
        <button class="btn secondary" id="shuffle">↻ New plan</button>
        <button class="btn secondary" id="copy">Copy as text</button>
        <button class="btn" id="save">Save session</button>
      </div>
    </div>
  </section>

  <section id="tab-drills" hidden>
    <div class="card">
      <h2>Drill library</h2>
      <p class="lvl" id="lib-hint" style="margin:-4px 0 10px"></p>
      <div class="lib-filters" id="lib-filters"></div>
      <div id="library"></div>
    </div>
  </section>

  <section id="tab-history" hidden>
    <div class="card"><h2>Last 10 saved sessions</h2><div id="history"></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { DRILLS } from "./drills.js";
import { LEVELS, SESSION_MINUTES, GROUP_SIZES, GAME_OPTIONS, buildSession, planToText, noteFor, groupFit, alternativesFor, swapDrill, playerOnly } from "./planner.js";
import { loadDrills, loadHistory, saveSession, recentDrillIds } from "./db.js";
import { courtSVG, DIAGRAM_LEGEND } from "./diagram.js";

const $ = (id) => document.getElementById(id);
const PREFS_KEY = "tennis-planner:prefs";
const CAT_COLORS = { warmup: "#e0a800", forehand: "#3f7d20", backhand: "#6b9e3a", net: "#7a5cc2", movement: "#7a5cc2",
  rally: "#c2410c", combo: "#b45309", serve: "#0e7490", game: "#be185d", cooldown: "#64748b", break: "var(--break)" };

const state = { drills: DRILLS, online: false, history: [], plan: null, opts: null, saved: false };

// ── prefs (per-device convenience only) ──
function readPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || null; } catch { return null; }
}
function writePrefs(p) {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {}
}

// ── settings UI ──
const prefs = { levels: [1], serve: true, game: 20, players: 6, ...readPrefs() };
if (typeof prefs.game === "boolean") prefs.game = prefs.game ? 20 : 0; // prefs saved before games had a length
LEVELS.forEach((name, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = name;
  b.dataset.level = i;
  b.setAttribute("aria-pressed", prefs.levels.includes(i));
  b.onclick = () => {
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
    syncGenerate();
  };
  $("levels").append(b);
});
GROUP_SIZES.forEach((n) => {
  const b = document.createElement("button");
  b.textContent = n;
  b.dataset.players = n;
  b.setAttribute("role", "radio");
  b.setAttribute("aria-checked", n === prefs.players);
  b.onclick = () => $("players").querySelectorAll("button").forEach((x) => x.setAttribute("aria-checked", x === b));
  $("players").append(b);
});
GAME_OPTIONS.forEach((n) => {
  const b = document.createElement("button");
  b.textContent = n ? `${n} min` : "Off";
  b.dataset.game = n;
  b.setAttribute("role", "radio");
  b.setAttribute("aria-checked", n === prefs.game);
  b.onclick = () => $("game").querySelectorAll("button").forEach((x) => x.setAttribute("aria-checked", x === b));
  $("game").append(b);
});
$("serve").checked = prefs.serve;

function currentOpts() {
  const levels = [...document.querySelectorAll("#levels .chip[aria-pressed=true]")].map((b) => +b.dataset.level);
  const players = +($("players").querySelector("[aria-checked=true]")?.dataset.players || 6);
  const game = +($("game").querySelector("[aria-checked=true]")?.dataset.game ?? 20);
  return { levels, players, serve: $("serve").checked, game };
}
function syncGenerate() {
  const none = !currentOpts().levels.length;
  $("generate").disabled = none;
  $("generate").textContent = none ? "Pick at least one level" : "Generate 2-hour plan";
}

// ── render ──
const fmt = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Shuffle just this block: ↻ picks another fitting drill.
const shuffleBtn = (i) => `<button class="shuffle" data-swap="${i}" aria-label="Shuffle this drill">↻ Shuffle</button>`;

// …or the coach picks one from the list (inside the open card).
function chooser(plan, i, opts) {
  const alts = alternativesFor(plan, i, opts);
  if (!alts.length) return "";
  const lv = (d) => d.minLevel === d.maxLevel ? LEVELS[d.minLevel] : `${LEVELS[d.minLevel]}–${LEVELS[d.maxLevel]}`;
  return `<select class="choose" data-choose="${i}" aria-label="Choose a different drill">
      <option value="">Pick a different drill… (${alts.length})</option>
      ${alts.map((d) => `<option value="${esc(d.id)}">${esc(d.name)} · ${lv(d)}</option>`).join("")}
    </select>`;
}

function replaceBlock(i, drill) {
  const opts = { ...state.opts, drills: state.drills, recentDrillIds: recentDrillIds(state.history) };
  state.plan = swapDrill(state.plan, i, opts, { drill, seed: (Math.random() * 2 ** 32) >>> 0 });
  state.saved = false;
  render();
  // keep the swapped block in view and show what it became
  const li = $("timeline").children[i];
  li?.classList.add("swapped");
  toast(`${state.plan[i].label}: ${state.plan[i].drill.name}`);
}

const list = (title, xs, ordered) => xs?.length
  ? `<h4>${title}</h4><${ordered ? "ol" : "ul"}>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>` : "";

// The open card, in the order a coach needs it on court: picture → how to set up
// this group → steps → what to look for → per-level tweaks. The rest is tucked away.
function drillBody(d, { levels, players }, extra = "") {
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
  const group = d.groupNotes?.[players]?.how;
  const notes = levels.map((l) => [l, noteFor(d, l)]).filter(([, n]) => n);
  const lvl = notes.length === 1
    ? `<h4>For ${LEVELS[notes[0][0]]}</h4><p>${esc(notes[0][1])}</p>`
    : notes.length ? `<h4>Per level</h4><ul class="lvls">${notes.map(([l, n]) => `<li><b>${LEVELS[l]}</b>${esc(n)}</li>`).join("")}</ul>` : "";
  const more = [
    list("Common mistakes → fix", d.commonMistakes),
    d.equipment ? `<h4>Equipment</h4><p>${esc(d.equipment)}</p>` : "",
    d.videoUrl ? `<p style="margin-top:10px"><a href="${esc(d.videoUrl)}" target="_blank" rel="noopener">▶ Watch a video demo</a></p>` : "",
    d.sources?.length ? `<p class="sources">Based on: ${d.sources.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join(" · ")}</p>` : "",
  ].join("");
  return `<div class="drill-body">
    ${d.imageUrl ? `<img class="photo" src="${esc(d.imageUrl)}" alt="${esc(d.name)}" loading="lazy">` : ""}
    ${d.diagram ? courtSVG(d.diagram, `Court diagram: ${d.name}`) + DIAGRAM_LEGEND : ""}
    ${group ? `<h4>👥 ${players} players</h4><p class="tip">${esc(group)}</p>` : d.setup ? `<h4>Setup</h4><p>${esc(d.setup)}</p>` : ""}
    ${list("Steps", d.steps, true)}
    ${list("Watch for", d.coachingPoints)}
    ${d.successTarget ? `<h4>🎯 Goal</h4><p>${esc(d.successTarget)}</p>` : ""}
    ${lvl}
    ${more ? `<details class="extra"><summary>Mistakes, equipment & sources</summary>${more}</details>` : ""}
    ${extra}
  </div>`;
}

function render() {
  const { plan, opts } = state;
  $("sum-title").textContent = opts.levels.map((l) => LEVELS[l]).join(" + ");
  $("sum-meta").textContent = `${opts.players} players · ${SESSION_MINUTES} min · Serve ${opts.serve ? "10 min" : "off"} · Games ${opts.game ? `${opts.game} min` : "off"}`;
  $("bar").innerHTML = plan.map((it) => {
    const c = CAT_COLORS[it.kind === "break" ? "break" : it.drill?.category] || "var(--muted)";
    return `<i style="width:${(it.minutes / SESSION_MINUTES) * 100}%;background:${c}" title="${esc(it.label)}"></i>`;
  }).join("");
  const swapOpts = { ...opts, drills: state.drills, recentDrillIds: recentDrillIds(state.history) };
  $("timeline").innerHTML = plan.map((it, i) => {
    if (it.kind === "break")
      return `<li class="item break"><div class="time">${fmt(it.start)}</div><div><div class="block">Break</div><div class="name">💧 Water break <span class="mins">· ${it.minutes}'</span></div></div></li>`;
    const d = it.drill || {};
    return `<li class="item"><div class="time">${fmt(it.start)}</div><div>
      <div class="head"><div class="block">${esc(it.label)}</div>${shuffleBtn(i)}</div>
      <details class="drill"><summary>
        <div class="name">${esc(d.name || "—")} <span class="mins">· ${it.minutes}'</span></div>
        <p class="cues">${esc(d.summary)}</p>
        <span class="more">How to run it</span>
      </summary>${drillBody(d, opts, chooser(plan, i, swapOpts))}</details>
    </div></li>`;
  }).join("");
  $("save").disabled = !state.online || state.saved;
  $("save").textContent = state.saved ? "Saved ✓" : state.online ? "Save session" : "Save (offline)";
  $("result").hidden = false;
}

function generate() {
  const opts = currentOpts();
  if (!opts.levels.length) return;
  writePrefs(opts);
  state.opts = opts;
  state.plan = buildSession({
    ...opts,
    drills: state.drills,
    recentDrillIds: recentDrillIds(state.history),
    seed: (Math.random() * 2 ** 32) >>> 0,
  });
  state.saved = false;
  render();
}

function renderHistory() {
  const byId = new Map(state.drills.map((d) => [d.id, d]));
  if (!state.online) { $("history").innerHTML = `<p class="empty">History is unavailable while offline.</p>`; return; }
  if (!state.history.length) { $("history").innerHTML = `<p class="empty">No saved sessions yet.</p>`; return; }
  $("history").innerHTML = state.history.map((s) => {
    const when = new Date(s.created_at).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    const rows = s.plan.map((it) => it.kind === "break" ? `<li>${fmt(it.start)} Water break</li>`
      : `<li>${fmt(it.start)} ${esc(it.label)}: ${esc(byId.get(it.drillId)?.name || it.drillId)} (${it.minutes}')</li>`).join("");
    return `<details class="hist"><summary><b>${esc(s.levels.map((l) => LEVELS[l]).join(" + "))}${s.players ? ` · ${s.players} players` : ""}</b><span>${when}</span></summary>
      <ul>${rows}</ul></details>`;
  }).join("");
}

// ── drill library: every drill the selected levels can do, by category ──
const CATEGORIES = [["all", "All"], ["warmup", "Warm-up"], ["forehand", "Forehand"], ["backhand", "Backhand"], ["net", "Net"], ["combo", "Mixed"],
  ["movement", "Movement"], ["rally", "Rally"], ["serve", "Serve"], ["game", "Game"], ["cooldown", "Cool-down"]];
let libCat = "all";
function renderLibrary() {
  const { levels, players } = currentOpts();
  const lo = levels.length ? Math.min(...levels) : 0;
  const hi = levels.length ? Math.max(...levels) : 3;
  $("lib-hint").textContent = levels.length
    ? `Showing drills that suit ${levels.map((l) => LEVELS[l]).join(" + ")}, ${players} players (change on the Plan tab).`
    : "Showing all drills. Pick levels on the Plan tab to filter.";
  $("lib-filters").innerHTML = CATEGORIES.map(([k, n]) =>
    `<button class="chip" data-cat="${k}" aria-pressed="${k === libCat}">${n}</button>`).join("");
  $("lib-filters").querySelectorAll(".chip").forEach((b) => (b.onclick = () => { libCat = b.dataset.cat; renderLibrary(); }));
  const shown = state.drills
    .filter((d) => (libCat === "all" || d.category === libCat) && d.minLevel <= hi && d.maxLevel >= lo)
    .sort((a, b) => CATEGORIES.findIndex(([k]) => k === a.category) - CATEGORIES.findIndex(([k]) => k === b.category) || a.minLevel - b.minLevel);
  const lv = (d) => d.minLevel === d.maxLevel ? LEVELS[d.minLevel] : `${LEVELS[d.minLevel]} – ${LEVELS[d.maxLevel]}`;
  const cat = (d) => CATEGORIES.find(([k]) => k === d.category)?.[1] ?? d.category;
  $("library").innerHTML = shown.length ? shown.map((d) => `<div class="lib-item">
      <div class="block">${esc(cat(d))} · ${esc(d.type)}</div>
      <details class="drill"><summary>
        <div class="name">${esc(d.name)}</div>
        <div class="lvl">${lv(d)}${groupFit(d, players) === 0 ? `<span class="unfit">Not for ${players} players</span>` : ""}${playerOnly(d) && d.category !== "game" ? `<span class="unfit">No coach · not used in plans</span>` : ""}</div>
        <p class="cues">${esc(d.summary)}</p>
        <span class="more">How to run it</span>
      </summary>${drillBody(d, { players, levels: (levels.length ? levels : [0, 1, 2, 3]).filter((l) => d.levelNotes[l]) })}</details></div>`).join("")
    : `<p class="empty">No drills in this category for these levels.</p>`;
}

function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 1800);
}

// ── events ──
$("generate").onclick = generate;
$("timeline").addEventListener("click", (e) => {
  const b = e.target.closest("[data-swap]");
  if (b) replaceBlock(+b.dataset.swap);
});
$("timeline").addEventListener("change", (e) => {
  const sel = e.target.closest("[data-choose]");
  if (!sel?.value) return;
  replaceBlock(+sel.dataset.choose, state.drills.find((d) => d.id === sel.value));
});
$("shuffle").onclick = generate;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(planToText(state.plan, state.opts)); toast("Copied"); }
  catch { toast("Copy failed"); }
};
$("save").onclick = async () => {
  $("save").disabled = true;
  try {
    await saveSession({ ...state.opts, plan: state.plan });
    state.saved = true;
    state.history = await loadHistory();
    renderHistory();
    toast("Session saved");
  } catch (e) {
    console.error(e);
    toast("Save failed");
  }
  render();
};
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
  $("tab-plan").hidden = b.dataset.tab !== "plan";
  $("tab-history").hidden = b.dataset.tab !== "history";
  $("tab-drills").hidden = b.dataset.tab !== "drills";
  if (b.dataset.tab === "drills") renderLibrary();
}));

// ── boot: try Supabase, fall back to built-in drills ──
syncGenerate();
renderHistory();
try {
  const [drills, history] = await Promise.all([loadDrills(), loadHistory()]);
  Object.assign(state, { drills, history, online: true });
} catch (e) {
  console.warn("Offline mode:", e);
  $("banner").textContent = "Offline — using built-in drills. Saving and history are disabled.";
  $("banner").hidden = false;
}
renderHistory();
if (state.plan) render();
</script>
</body>
</html>
